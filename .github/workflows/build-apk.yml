name: Build Web APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Generate APK from Web Files
      uses: KushalP/web-to-apk@v1
      with:
        args: |
          {
            "name": "Kalender Istitar",
            "short_name": "KalenderIstitar",
            "start_url": "/index.html",
            "background_color": "#ffffff",
            "theme_color": "#000000",
            "display": "standalone",
            "orientation": "portrait"
          }

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: Kalender-Istitar-APK
        path: "*.apk"
