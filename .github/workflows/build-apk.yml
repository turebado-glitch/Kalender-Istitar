name: Build Web APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Package Web App into Archive
      run: |
        # Membuat arsip zip dari seluruh file web Anda untuk dibungkus
        mkdir -p output_apk
        zip -r output_apk/kalender-istitar-web.zip . -x ".git*" ".github*"

    - name: Upload Web App Package
      uses: actions/upload-artifact@v4
      with:
        name: Kalender-Istitar-Web-Package
        path: output_apk/kalender-istitar-web.zip
