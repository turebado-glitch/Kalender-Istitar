name: Build APK & AAB Kalender Istitar

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
            if [ -n "$SDKM" ]; then
              yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            fi
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK & AAB
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi
          GRADLE_DIR=$(dirname "$(find . -maxdepth 4 -name "settings.gradle.kts" | head -n 1)")
          if [ -z "$GRADLE_DIR" ] || [ ! -f "$GRADLE_DIR/settings.gradle.kts" ]; then
            echo "File settings.gradle.kts tidak ditemukan! Pastikan file ZIP atau folder KalenderIstitarAndroid sudah diunggah ke repository."
            exit 1
          fi
          cd "$GRADLE_DIR"
          gradle assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Kalender-Istitar-v1.11.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/Kalender-Istitar-v1.11.aab"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalender-Istitar-Release-APK
          path: Kalender-Istitar-v1.11.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalender-Istitar-Release-AAB
          path: Kalender-Istitar-v1.11.aab
